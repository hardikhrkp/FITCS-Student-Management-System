<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password · FITCS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark">FITCS</div>
    <p class="eyebrow">ACCOUNT SECURITY</p>
    <h1>Change password</h1>
    <p class="muted">Choose a new password before continuing.</p>
    <form id="changePasswordForm">
      <label for="newPassword">New password</label>
      <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
      <button type="submit">Update password →</button>
      <p id="message" class="message" role="status"></p>
    </form>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
